<!-- Firebase SDK Libraries (10.12.0 UMD) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
    (function() {
        // INSTANT MEMORY HYDRATION (Lightning Fast Initial Load)
        try {
            const cachedMenu = localStorage.getItem('acp_cached_menu');
            const cachedPosts = localStorage.getItem('acp_cached_posts');

            if (cachedMenu && typeof menuData !== 'undefined' && menuData.length === 0) {
                const parsedMenu = JSON.parse(cachedMenu);
                if (Array.isArray(parsedMenu) && parsedMenu.length > 0) {
                    menuData.length = 0;
                    menuData.push(...parsedMenu);
                    workingMenuData = JSON.parse(JSON.stringify(menuData));
                    if (typeof renderCustomerMenu === 'function') renderCustomerMenu();
                    if (typeof renderLocalMenu === 'function') renderLocalMenu();
                    if (typeof renderDrinksMenu === 'function') renderDrinksMenu();
                    if (typeof renderAdminCatalog === 'function') renderAdminCatalog();
                }
            }

            if (cachedPosts && typeof feedPosts !== 'undefined' && feedPosts.length === 0) {
                const parsedPosts = JSON.parse(cachedPosts);
                if (Array.isArray(parsedPosts) && parsedPosts.length > 0) {
                    feedPosts.length = 0;
                    feedPosts.push(...parsedPosts);
                    workingFeedPosts = JSON.parse(JSON.stringify(feedPosts));
                    if (typeof renderCustomerSocialFeeds === 'function') renderCustomerSocialFeeds();
                    if (typeof renderAdminPostsList === 'function') renderAdminPostsList();
                }
            }
        } catch(e) {
            console.warn("Local hydration skip:", e);
        }

        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAU3wBPK_iKzH-F0qfRp9KFG4Keq8tmm2U",
          authDomain: "alfa-corex-1-c9856.firebaseapp.com",
          projectId: "alfa-corex-1-c9856",
          storageBucket: "alfa-corex-1-c9856.firebasestorage.app",
          messagingSenderId: "685367477889",
          appId: "1:685367477889:web:f83b7028683df4fdc96f80",
          measurementId: "G-ZKPVH2RPW5"
        };

        if (typeof firebase === 'undefined') return;

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();

        // FAST REAL-TIME BACKGROUND FIRESTORE LISTENERS

        // 1. Sync Food Menu Catalog
        db.collection("menu").onSnapshot(
            (snapshot) => {
                const items = [];
                snapshot.forEach((doc) => { items.push({ ...doc.data() }); });
                
                items.sort((a, b) => {
                    if (a.order !== undefined && b.order !== undefined) {
                        return a.order - b.order;
                    }
                    return 0;
                });

                menuData.length = 0;
                if (items.length > 0) {
                    menuData.push(...items);
                    try { localStorage.setItem('acp_cached_menu', JSON.stringify(items)); } catch(e){}
                } else {
                    try { localStorage.removeItem('acp_cached_menu'); } catch(e){}
                }
                workingMenuData = JSON.parse(JSON.stringify(menuData));

                if (typeof renderCustomerMenu === 'function') renderCustomerMenu();
                if (typeof renderLocalMenu === 'function') renderLocalMenu();
                if (typeof renderDrinksMenu === 'function') renderDrinksMenu();
                if (typeof renderAdminCatalog === 'function') renderAdminCatalog();
                console.log("⚡ Live Menu Synced:", items.length, "items");
            },
            (error) => { console.error("❌ Firestore Menu Error:", error.message); }
        );

        // 2. Sync Social Feed Posts
        db.collection("posts").onSnapshot(
            (snapshot) => {
                const posts = [];
                snapshot.forEach((doc) => { posts.push({ ...doc.data() }); });
                
                posts.sort((a, b) => {
                    if (a.order !== undefined && b.order !== undefined) {
                        return a.order - b.order;
                    }
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });

                feedPosts.length = 0;
                if (posts.length > 0) {
                    feedPosts.push(...posts);
                    try { localStorage.setItem('acp_cached_posts', JSON.stringify(posts)); } catch(e){}
                } else {
                    try { localStorage.removeItem('acp_cached_posts'); } catch(e){}
                }
                workingFeedPosts = JSON.parse(JSON.stringify(feedPosts));

                if (typeof renderCustomerSocialFeeds === 'function') renderCustomerSocialFeeds();
                if (typeof renderAdminPostsList === 'function') renderAdminPostsList();
                console.log("⚡ Live Posts Synced:", posts.length, "posts");
            },
            (error) => { console.error("❌ Firestore Posts Error:", error.message); }
        );

        // 3. Sync Customer Orders
        db.collection("orders").onSnapshot(
            (snapshot) => {
                const orders = [];
                snapshot.forEach((doc) => { orders.push({ ...doc.data() }); });
                
                ordersList.length = 0;
                if (orders.length > 0) {
                    ordersList.push(...orders);
                }

                if (typeof renderAdminOrdersList === 'function') renderAdminOrdersList();
                console.log("⚡ Live Orders Synced:", orders.length, "orders");
            },
            (error) => { console.error("❌ Firestore Orders Error:", error.message); }
        );

        // 4. Sync CRM Registered Users
        db.collection("users").onSnapshot(
            (snapshot) => {
                const users = [];
                snapshot.forEach((doc) => { users.push({ ...doc.data() }); });

                users.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                registeredUsers.length = 0;
                if (users.length > 0) {
                    registeredUsers.push(...users);
                }

                if (typeof renderRegisteredUsers === 'function') renderRegisteredUsers();
                console.log("⚡ Live Users Synced:", users.length, "users");
            },
            (error) => { console.error("❌ Firestore Users Error:", error.message); }
        );

        // DIRECT FIRESTORE WRITE / DELETE HELPERS
        window.dbSaveFoodItem = function(item) {
            if (!item || !item.id) return;
            db.collection("menu").doc(item.id.toString()).set(item, { merge: true });
        };

        window.dbDeleteFoodItem = function(id) {
            if (!id) return;
            db.collection("menu").doc(id.toString()).delete();
        };

        window.dbSavePost = function(post) {
            if (!post || !post.id) return;
            db.collection("posts").doc(post.id.toString()).set(post, { merge: true });
        };

        window.dbDeletePost = function(id) {
            if (!id) return;
            db.collection("posts").doc(id.toString()).delete();
        };

        window.dbSaveOrder = function(order) {
            if (!order || !order.id) return;
            const cleanId = order.id.replace('#', '').replace(/[^a-zA-Z0-9]/g, '');
            db.collection("orders").doc(cleanId).set(order, { merge: true });
        };

        window.dbDeleteOrder = function(orderId) {
            if (!orderId) return;
            const cleanId = orderId.replace('#', '').replace(/[^a-zA-Z0-9]/g, '');
            db.collection("orders").doc(cleanId).delete();
        };

        window.dbSaveUser = function(user) {
            if (!user || !user.phone) return;
            if (!user.timestamp) user.timestamp = Date.now();
            const cleanId = user.phone.replace(/[^0-9]/g, '') || Date.now().toString();
            db.collection("users").doc(cleanId).set(user, { merge: true });
        };

        window.dbDeleteUser = function(phone) {
            if (!phone) return;
            const cleanId = phone.replace(/[^0-9]/g, '');
            db.collection("users").doc(cleanId).delete();
        };

        // MISSING FUNCTION FIX (User Reply Submission Bridge)
        if (typeof window.submitUserReply !== 'function') {
            window.submitUserReply = function() {
                const postId = parseInt(document.getElementById('userReplyPostId')?.value);
                const commentIndex = parseInt(document.getElementById('userReplyCommentIndex')?.value);
                const replyText = document.getElementById('userReplyText')?.value.trim();

                if (!replyText || isNaN(postId) || isNaN(commentIndex)) return;

                const post = feedPosts.find(p => p.id === postId);
                if (post && post.comments[commentIndex]) {
                    if (!post.comments[commentIndex].replies) {
                        post.comments[commentIndex].replies = [];
                    }

                    let commenterName = currentUser ? currentUser.name : (guestSessionName || "Guest User");
                    post.comments[commentIndex].replies.push({
                        commenter: commenterName,
                        text: replyText,
                        isAdmin: false,
                        timestamp: Date.now(),
                        likes: 0,
                        dislikes: 0,
                        likedUsers: [],
                        dislikedUsers: []
                    });

                    document.getElementById('userReplyText').value = '';
                    if (typeof closeUserReplyModal === 'function') closeUserReplyModal();
                    if (typeof renderCustomerSocialFeeds === 'function') renderCustomerSocialFeeds();
                    if (typeof showNotification === 'function') showNotification('Reply posted successfully!');
                }
            };
        }

        // FRONTEND ACTION HOOKS FOR IMMEDIATE REAL-TIME FIRESTORE SYNC

        const orig_handleFoodFormSubmit = window.handleFoodFormSubmit;
        window.handleFoodFormSubmit = function(event) {
            const editId = document.getElementById('editFoodId')?.value;
            if (orig_handleFoodFormSubmit) orig_handleFoodFormSubmit(event);
            if (menuData && menuData.length > 0) {
                const target = editId ? menuData.find(x => x.id == editId) : menuData[menuData.length - 1];
                if (target) {
                    if (target.order === undefined) target.order = menuData.indexOf(target);
                    window.dbSaveFoodItem(target);
                }
            }
        };

        const orig_saveCatalogOrderChanges = window.saveCatalogOrderChanges;
        window.saveCatalogOrderChanges = function() {
            if (orig_saveCatalogOrderChanges) orig_saveCatalogOrderChanges();
            if (menuData && menuData.length > 0) {
                menuData.forEach((item, idx) => {
                    item.order = idx;
                    window.dbSaveFoodItem(item);
                });
            }
        };

        const orig_toggleCatalogItemHide = window.toggleCatalogItemHide;
        window.toggleCatalogItemHide = function(id) {
            if (orig_toggleCatalogItemHide) orig_toggleCatalogItemHide(id);
            const item = menuData.find(x => x.id == id);
            if (item) window.dbSaveFoodItem(item);
        };

        const orig_toggleCatalogItemAvailability = window.toggleCatalogItemAvailability;
        window.toggleCatalogItemAvailability = function(id) {
            if (orig_toggleCatalogItemAvailability) orig_toggleCatalogItemAvailability(id);
            const item = menuData.find(x => x.id == id);
            if (item) window.dbSaveFoodItem(item);
        };

        const orig_deleteFoodCatalog = window.deleteFoodCatalog;
        window.deleteFoodCatalog = function(id) {
            if (orig_deleteFoodCatalog) orig_deleteFoodCatalog(id);
            window.dbDeleteFoodItem(id);
        };

        const orig_handleFeedPostSubmit = window.handleFeedPostSubmit;
        window.handleFeedPostSubmit = function(event) {
            const editId = document.getElementById('editPostId')?.value;
            if (orig_handleFeedPostSubmit) orig_handleFeedPostSubmit(event);
            if (feedPosts && feedPosts.length > 0) {
                const target = editId ? feedPosts.find(p => p.id == editId) : feedPosts[0];
                if (target) {
                    if (target.order === undefined) target.order = feedPosts.indexOf(target);
                    window.dbSavePost(target);
                }
            }
        };

        const orig_savePostOrderChanges = window.savePostOrderChanges;
        window.savePostOrderChanges = function() {
            if (orig_savePostOrderChanges) orig_savePostOrderChanges();
            if (feedPosts && feedPosts.length > 0) {
                feedPosts.forEach((post, idx) => {
                    post.order = idx;
                    window.dbSavePost(post);
                });
            }
        };

        const orig_togglePostHide = window.togglePostHide;
        window.togglePostHide = function(id) {
            if (orig_togglePostHide) orig_togglePostHide(id);
            const post = feedPosts.find(p => p.id == id);
            if (post) window.dbSavePost(post);
        };

        const orig_deleteFeedPost = window.deleteFeedPost;
        window.deleteFeedPost = function(postId) {
            if (orig_deleteFeedPost) orig_deleteFeedPost(postId);
            window.dbDeletePost(postId);
        };

        const orig_submitComment = window.submitComment;
        window.submitComment = function(id) {
            if (orig_submitComment) orig_submitComment(id);
            const post = feedPosts.find(p => p.id === id);
            if (post) window.dbSavePost(post);
        };

        const orig_submitUserReply = window.submitUserReply;
        window.submitUserReply = function() {
            const postId = parseInt(document.getElementById('userReplyPostId')?.value);
            if (orig_submitUserReply) orig_submitUserReply();
            if (postId) {
                const post = feedPosts.find(p => p.id === postId);
                if (post) window.dbSavePost(post);
            }
        };

        const orig_likePost = window.likePost;
        window.likePost = function(id) {
            if (orig_likePost) orig_likePost(id);
            const post = feedPosts.find(p => p.id === id);
            if (post) window.dbSavePost(post);
        };

        const orig_likeComment = window.likeComment;
        window.likeComment = function(postId, commentIndex) {
            if (orig_likeComment) orig_likeComment(postId, commentIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_dislikeComment = window.dislikeComment;
        window.dislikeComment = function(postId, commentIndex) {
            if (orig_dislikeComment) orig_dislikeComment(postId, commentIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_likeReply = window.likeReply;
        window.likeReply = function(postId, commentIndex, replyIndex) {
            if (orig_likeReply) orig_likeReply(postId, commentIndex, replyIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_dislikeReply = window.dislikeReply;
        window.dislikeReply = function(postId, commentIndex, replyIndex) {
            if (orig_dislikeReply) orig_dislikeReply(postId, commentIndex, replyIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_deleteComment = window.deleteComment;
        window.deleteComment = function(postId, commentIndex) {
            if (orig_deleteComment) orig_deleteComment(postId, commentIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_deleteReply = window.deleteReply;
        window.deleteReply = function(postId, commentIndex, replyIndex) {
            if (orig_deleteReply) orig_deleteReply(postId, commentIndex, replyIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_saveEditComment = window.saveEditComment;
        window.saveEditComment = function(postId, commentIndex) {
            if (orig_saveEditComment) orig_saveEditComment(postId, commentIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_saveEditReply = window.saveEditReply;
        window.saveEditReply = function(postId, commentIndex, replyIndex) {
            if (orig_saveEditReply) orig_saveEditReply(postId, commentIndex, replyIndex);
            const post = feedPosts.find(p => p.id === postId);
            if (post) window.dbSavePost(post);
        };

        const orig_finalizeOrder = window.finalizeOrderAndSendWhatsApp;
        window.finalizeOrderAndSendWhatsApp = function() {
            if (orig_finalizeOrder) orig_finalizeOrder();
            if (ordersList && ordersList.length > 0) {
                window.dbSaveOrder(ordersList[0]);
            }
        };

        const orig_approveAdminOrder = window.approveAdminOrder;
        window.approveAdminOrder = function(index) {
            if (orig_approveAdminOrder) orig_approveAdminOrder(index);
            if (ordersList && ordersList[index]) {
                window.dbSaveOrder(ordersList[index]);
            }
        };

        const orig_removeAdminOrder = window.removeAdminOrder;
        window.removeAdminOrder = function(index) {
            const ord = ordersList ? ordersList[index] : null;
            if (orig_removeAdminOrder) orig_removeAdminOrder(index);
            if (ord && ord.id) window.dbDeleteOrder(ord.id);
        };

        const orig_registerUser = window.registerUser;
        window.registerUser = function() {
            if (orig_registerUser) orig_registerUser();
            if (currentUser) {
                if (!currentUser.timestamp) currentUser.timestamp = Date.now();
                window.dbSaveUser(currentUser);
            }
        };

        const orig_removeCustomerRecord = window.removeCustomerRecord;
        window.removeCustomerRecord = function(idx) {
            const user = registeredUsers ? registeredUsers[idx] : null;
            if (orig_removeCustomerRecord) orig_removeCustomerRecord(idx);
            if (user && user.phone) window.dbDeleteUser(user.phone);
        };
    })();
</script>
